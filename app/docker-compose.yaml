services:
  app-ingressos:
    build: .
    container_name: app-ingressos
    ports:
      - "${APP_PORT}:3000"
      - 5555:5555
    volumes:
      - .:/home/node/app
    networks:
      - api

  db-ingressos:
    image: mysql:8.0.30-debian
    container_name: db-ingressos
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - ./db.sql:/docker-entrypoint-initdb.d/db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 15s
      retries: 5
      start_period: 5s
    networks:
      - api



networks:
    api:
        driver: bridge